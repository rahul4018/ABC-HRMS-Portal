{% extends 'layouts/base.html' %}

{% block content %}

<h2 class="mb-4">
    Company Settings
</h2>

<div class="card">

    <div class="card-body">

        <form method="post"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-3">

                <label>Company Name</label>

                <input type="text"
                       name="company_name"
                       class="form-control"
                       value="{{ settings_obj.company_name }}">

            </div>

            <div class="mb-3">

                <label>Address</label>

                <textarea name="company_address"
                          class="form-control">{{ settings_obj.company_address }}</textarea>

            </div>

            <div class="mb-3">

                <label>Email</label>

                <input type="email"
                       name="company_email"
                       class="form-control"
                       value="{{ settings_obj.company_email }}">

            </div>

            <div class="mb-3">

                <label>Phone</label>

                <input type="text"
                       name="company_phone"
                       class="form-control"
                       value="{{ settings_obj.company_phone }}">

            </div>

            <div class="mb-3">

                <label>Logo</label>

                <input type="file"
                       name="company_logo"
                       class="form-control">
            </div>

            <button type="submit"
                    class="btn btn-dark">

                Save Settings

            </button>

        </form>

    </div>

</div>

{% endblock %}
