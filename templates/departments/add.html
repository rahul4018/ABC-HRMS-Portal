{% extends 'layouts/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold mb-1">Add Department</h2><p class="text-muted mb-0">Create a department and assign its head.</p></div><a href="{% url 'department_list' %}" class="btn btn-secondary">← Back</a></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4">
<form method="post">{% csrf_token %}
<div class="row g-4">
<div class="col-md-6"><label class="form-label fw-semibold">Department Name *</label><input name="name" class="form-control" required></div>
<div class="col-md-6"><label class="form-label fw-semibold">Department Code</label><input name="code" class="form-control" maxlength="20" placeholder="ENG"></div>
<div class="col-12"><label class="form-label fw-semibold">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
<div class="col-md-6"><label class="form-label fw-semibold">Department Head</label><select name="head_employee" class="form-select"><option value="">Not Assigned</option>{% for employee in employees %}<option value="{{ employee.id }}">{{ employee.user.get_full_name }} — {{ employee.employee_id }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label fw-semibold">Status</label><select name="status" class="form-select"><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select></div>
</div>
<div class="mt-4 d-flex gap-2"><button class="btn btn-primary" type="submit">Create Department</button><a href="{% url 'department_list' %}" class="btn btn-outline-secondary">Cancel</a></div>
</form></div></div>
{% endblock %}
