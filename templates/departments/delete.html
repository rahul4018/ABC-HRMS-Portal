{% extends 'layouts/base.html' %}
{% block content %}
<div class="card border-0 shadow-sm"><div class="card-body p-5 text-center"><h3 class="fw-bold">Deactivate {{ department.name }}?</h3><p class="text-muted">This will mark the department inactive and preserve its employee history.</p><form method="post" class="d-inline">{% csrf_token %}<button type="submit" class="btn btn-danger">Deactivate Department</button></form> <a href="{% url 'department_list' %}" class="btn btn-outline-secondary">Cancel</a></div></div>
{% endblock %}
