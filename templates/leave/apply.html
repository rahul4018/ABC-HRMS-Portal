{% extends 'layouts/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            Apply Leave
        </h2>

        <p class="text-muted mb-0">
            Submit leave request for approval.
        </p>

    </div>

    <a href="/leave/"
       class="btn btn-secondary">

        <i class="bi bi-arrow-left me-1"></i>

        Back

    </a>

</div>

<div class="card border-0 shadow-sm">

    <div class="card-body p-4">

        <form method="POST">

            {% csrf_token %}

            <div class="row g-4">

                <!-- Leave Type -->
                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Leave Type
                    </label>

                    <select name="leave_type"
                            class="form-select"
                            required>

                        <option value="">
                            Select Leave Type
                        </option>

                        <option value="SICK">
                            Sick Leave
                        </option>

                        <option value="CASUAL">
                            Casual Leave
                        </option>

                        <option value="PAID">
                            Paid Leave
                        </option>

                        <option value="UNPAID">
                            Unpaid Leave
                        </option>

                    </select>

                </div>

                <!-- Start Date -->
                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        Start Date
                    </label>

                    <input type="date"
                           name="start_date"
                           class="form-control"
                           required>

                </div>

                <!-- End Date -->
                <div class="col-md-3">

                    <label class="form-label fw-semibold">
                        End Date
                    </label>

                    <input type="date"
                           name="end_date"
                           class="form-control"
                           required>

                </div>

                <!-- Reason -->
                <div class="col-12">

                    <label class="form-label fw-semibold">
                        Reason
                    </label>

                    <textarea name="reason"
                              rows="5"
                              class="form-control"
                              placeholder="Explain your leave reason..."
                              required></textarea>

                </div>

            </div>

            <div class="mt-4">

                <button type="submit"
                        class="btn btn-primary px-4">

                    <i class="bi bi-send-check me-1"></i>

                    Submit Leave Request

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
