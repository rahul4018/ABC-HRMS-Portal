{% extends 'layouts/base.html' %}

{% block content %}

<div class="container py-4">

    <div class="card border-0 shadow-sm">

        <div class="card-body p-5">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2 class="fw-bold mb-0">
                    Upload Employee Document
                </h2>

            </div>

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <!-- Employee Selection -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Employee

                    </label>

                    <select name="employee"
                            class="form-select"
                            required>

                        <option value="">
                            Select Employee
                        </option>

                        {% for employee in employees %}

                        <option value="{{ employee.id }}">

                            {{ employee.user.first_name }}
                            {{ employee.user.last_name }}
                            ({{ employee.user.email }})

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Document Title -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Document Title

                    </label>

                    <input type="text"
                           name="title"
                           class="form-control"
                           placeholder="Enter document title"
                           required>

                </div>

                <!-- Document Type -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Document Type

                    </label>

                    <select name="document_type"
                            class="form-select"
                            required>

                        <option value="">
                            Select Type
                        </option>

                        <option value="AADHAAR">
                            Aadhaar
                        </option>

                        <option value="PAN">
                            PAN
                        </option>

                        <option value="RESUME">
                            Resume
                        </option>

                        <option value="CERTIFICATE">
                            Certificate
                        </option>

                        <option value="CONTRACT">
                            Contract
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                </div>

                <!-- File Upload -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">

                        Upload File

                    </label>

                    <input type="file"
                           name="file"
                           class="form-control"
                           required>

                    <small class="text-muted">

                        Supported formats: PDF, DOC, DOCX, JPG, PNG

                    </small>

                </div>

                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary">

                        Upload Document

                    </button>

                    <a href="{% url 'document_list' %}"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
