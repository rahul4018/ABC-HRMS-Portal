{% extends 'layouts/base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold mb-1">
            Add Employee
        </h2>

        <p class="text-muted mb-0">
            Create and manage employee records securely.
        </p>

    </div>

    <a href="/employees/"
       class="btn btn-secondary">

        <i class="bi bi-arrow-left me-1"></i>

        Back

    </a>

</div>

<div class="card border-0 shadow-sm">

    <div class="card-body p-4">

        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}

            <!-- Personal Information -->
            <div class="mb-4">

                <h5 class="fw-bold border-bottom pb-2 mb-4">

                    <i class="bi bi-person-circle me-2"></i>

                    Personal Information

                </h5>

                <div class="row g-4">

                    <!-- Email -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Email Address

                        </label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="employee@company.com"
                               required>

                    </div>

                    <!-- Username -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Username

                        </label>

                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Enter username"
                               required>

                    </div>

                    <!-- Password -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Password

                        </label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Enter password"
                               required>

                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Phone Number

                        </label>

                        <input type="text"
                               name="phone"
                               class="form-control"
                               placeholder="+91 XXXXX XXXXX">

                    </div>

                    <!-- Address -->
                    <div class="col-12">

                        <label class="form-label fw-semibold">

                            Address

                        </label>

                        <textarea name="address"
                                  rows="4"
                                  class="form-control"
                                  placeholder="Enter complete address"></textarea>

                    </div>

                </div>

            </div>

            <!-- Employment Information -->
            <div class="mb-4">

                <h5 class="fw-bold border-bottom pb-2 mb-4">

                    <i class="bi bi-briefcase me-2"></i>

                    Employment Information

                </h5>

                <div class="row g-4">

                    <!-- Department -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Department

                        </label>

                        <select name="department"
                                class="form-select">

                            <option value="">
                                Select Department
                            </option>

                            {% for department in departments %}

                            <option value="{{ department.id }}">

                                {{ department.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Designation -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Designation

                        </label>

                        <input type="text"
                               name="designation"
                               class="form-control"
                               placeholder="Software Engineer">

                    </div>

                    <!-- Joining Date -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Joining Date

                        </label>

                        <input type="date"
                               name="joining_date"
                               class="form-control">

                    </div>

                    <!-- Salary -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Salary

                        </label>

                        <input type="number"
                               name="salary"
                               class="form-control"
                               placeholder="50000">

                    </div>

                    <!-- Status -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Employment Status

                        </label>

                        <select name="status"
                                class="form-select">

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="INACTIVE">
                                Inactive
                            </option>

                        </select>

                    </div>

                    <!-- Profile Picture -->
                    <div class="col-md-6">

                        <label class="form-label fw-semibold">

                            Profile Picture

                        </label>

                        <input type="file"
                               name="profile_picture"
                               class="form-control">

                    </div>

                </div>

            </div>

            <!-- Submit Buttons -->
            <div class="d-flex gap-3 mt-4">

                <button type="submit"
                        class="btn btn-primary px-4">

                    <i class="bi bi-person-plus-fill me-1"></i>

                    Create Employee

                </button>

                <a href="/employees/"
                   class="btn btn-outline-secondary px-4">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
