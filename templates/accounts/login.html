{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SkillChekHub Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card shadow">

        <div class="text-center mb-4">

            <img src="{% static 'images/logo.png' %}"
                 class="login-logo mb-3"
                 alt="Logo">

            <h2 class="fw-bold">
                SkillChekHub HRMS
            </h2>

            <p class="text-muted">
                Secure Employee Portal
            </p>

        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input type="email"
                       name="email"
                       class="form-control"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input type="password"
                       name="password"
                       class="form-control"
                       required>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100 login-btn">

                Login

            </button>

        </form>

    </div>

</div>

</body>
</html>
