{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC HRMS Portal | Change Password</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8fc;font-family:Inter,system-ui,sans-serif;color:#12213a}
        .card{width:min(430px,calc(100% - 40px));background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:34px;box-shadow:0 18px 50px rgba(26,58,107,.10)}
        h1{margin:0 0 8px;font-size:30px}.sub{margin:0 0 26px;color:#6b7280;font-size:14px}
        label{display:block;margin:0 0 8px;font-size:13px;font-weight:700}
        .field{margin-bottom:18px}
        input{width:100%;height:50px;padding:0 14px;border:1px solid #dfe5ee;border-radius:10px;box-sizing:border-box;font-size:14px;outline:0}
        input:focus{border-color:#1a3a6b;box-shadow:0 0 0 3px rgba(26,58,107,.10)}
        button{width:100%;height:50px;border:0;border-radius:10px;background:#1a3a6b;color:#fff;font-weight:800;cursor:pointer}
        .alert{margin-bottom:16px;padding:12px 14px;border-radius:10px;font-size:13px}
        .alert-error,.alert-danger{background:#fff1f2;color:#9f1239}.alert-success{background:#f0fdf4;color:#166534}
        .note{margin-top:20px;color:#7b8493;font-size:11px;line-height:1.6;text-align:center}
    </style>
</head>
<body>
    <main class="card">
        <h1>Change Password</h1>
        <p class="sub">Set a new password to continue.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="old_password">Old Password</label>
                <input type="password" id="old_password" name="old_password" autocomplete="current-password" required>
            </div>

            <div class="field">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" minlength="8" autocomplete="new-password" required>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required>
            </div>

            <button type="submit">Change Password</button>
        </form>

        <div class="note">
            Your new password must be at least 8 characters.
        </div>
    </main>
</body>
</html>
