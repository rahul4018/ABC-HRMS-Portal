{% extends 'layouts/base.html' %}
{% block content %}
<div class="container-fluid py-4">
<div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="fw-bold text-dark mb-1">Generate Payslip</h2><p class="text-muted mb-0">Create a complete monthly payroll record.</p></div><a href="{% url 'payslip_list' %}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
<div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="POST">{% csrf_token %}
<div class="row g-3 mb-4">
<div class="col-md-6"><label class="form-label fw-semibold">Employee <span class="text-danger">*</span></label><select name="employee" class="form-select" required><option value="">Select Employee</option>{% for employee in employees %}<option value="{{ employee.id }}">{{ employee.employee_id }} - {{ employee.user.get_full_name|default:employee.user.email }}</option>{% endfor %}</select></div>
<div class="col-md-3"><label class="form-label fw-semibold">Month <span class="text-danger">*</span></label><input type="text" name="month" class="form-control" placeholder="August" required></div>
<div class="col-md-3"><label class="form-label fw-semibold">Year <span class="text-danger">*</span></label><input type="number" name="year" class="form-control" value="{{ today.year }}" required></div>
<div class="col-md-4"><label class="form-label fw-semibold">Payslip Number</label><input type="text" name="payslip_number" class="form-control" placeholder="Auto-generated if blank"></div>
<div class="col-md-4"><label class="form-label fw-semibold">Pay Date</label><input type="date" name="pay_date" class="form-control" value="{{ today|date:'Y-m-d' }}"></div>
<div class="col-md-4"><label class="form-label fw-semibold">Payment Mode</label><select name="payment_mode" class="form-select"><option value="BANK_TRANSFER">Bank Transfer</option><option value="CASH">Cash</option><option value="CHEQUE">Cheque</option></select></div>
</div>

<div class="mb-4"><h5 class="fw-bold text-primary mb-3"><i class="bi bi-calendar-check me-1"></i>Attendance & Payable Days</h5><div class="row p-3 bg-light rounded-3 g-3">
<div class="col-sm-4"><label class="form-label small text-secondary">Days in Month</label><input type="number" min="1" name="days_in_month" class="form-control bg-white" value="30" required></div>
<div class="col-sm-4"><label class="form-label small text-secondary">Paid / Effective Work Days</label><input type="number" min="0" name="effective_work_days" class="form-control bg-white" value="30" required></div>
<div class="col-sm-4"><label class="form-label small text-secondary">LOP Days</label><input type="number" min="0" name="lop" class="form-control bg-white" value="0"></div>
</div></div>

<div class="mb-4"><h5 class="fw-bold text-success mb-3"><i class="bi bi-plus-circle me-1"></i>Earnings</h5><div class="row p-3 bg-light rounded-3 g-3">
<div class="col-md-4"><label class="form-label small text-secondary">Basic Salary</label><input type="number" step="0.01" name="basic_salary" class="form-control bg-white" required></div>
<div class="col-md-4"><label class="form-label small text-secondary">HRA</label><input type="number" step="0.01" name="hra" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Conveyance</label><input type="number" step="0.01" name="conveyance" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Special Allowance</label><input type="number" step="0.01" name="special_allowance" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Overtime</label><input type="number" step="0.01" name="overtime" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Bonus</label><input type="number" step="0.01" name="bonus" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Other Earnings</label><input type="number" step="0.01" name="other_earnings" class="form-control bg-white" value="0"></div>
</div></div>

<div class="mb-4"><h5 class="fw-bold text-danger mb-3"><i class="bi bi-dash-circle me-1"></i>Employee Deductions</h5><div class="row p-3 bg-light rounded-3 g-3">
<div class="col-md-4"><label class="form-label small text-secondary">PF</label><input type="number" step="0.01" name="pf" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">ESI</label><input type="number" step="0.01" name="esi" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Professional Tax</label><input type="number" step="0.01" name="professional_tax" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Income Tax / TDS</label><input type="number" step="0.01" name="income_tax" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">LOP Deduction</label><input type="number" step="0.01" name="lop_deduction" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Other Deductions</label><input type="number" step="0.01" name="other_deduction" class="form-control bg-white" value="0"></div>
</div></div>

<div class="mb-4"><h5 class="fw-bold text-info mb-3"><i class="bi bi-building-check me-1"></i>Employer Contributions</h5><div class="row p-3 bg-light rounded-3 g-3">
<div class="col-md-4"><label class="form-label small text-secondary">Employer PF</label><input type="number" step="0.01" name="employer_pf" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Employer ESI</label><input type="number" step="0.01" name="employer_esi" class="form-control bg-white" value="0"></div>
<div class="col-md-4"><label class="form-label small text-secondary">Other Employer Contribution</label><input type="number" step="0.01" name="employer_other" class="form-control bg-white" value="0"></div>
</div></div>

<div class="text-end pt-3 border-top"><button type="submit" class="btn btn-success px-4"><i class="bi bi-check-circle me-1"></i>Generate Payslip</button></div>
</form></div></div></div>
{% endblock %}
