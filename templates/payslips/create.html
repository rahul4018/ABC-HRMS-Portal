{% extends 'layouts/base.html' %}

{% block content %}
<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-1">Generate Payslip</h2>
            <p class="text-muted mb-0">Create monthly salary payslip records for workforce personnel.</p>
        </div>
        <a href="{% url 'payslip_list' %}" class="btn btn-secondary shadow-sm">
            <i class="bi bi-arrow-left me-1"></i> Back
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Employee <span class="text-danger">*</span></label>
                        <select name="employee" class="form-select" required>
                            <option value="">Select Employee</option>
                            {% for employee in employees %}
                                <option value="{{ employee.id }}">
                                    {{ employee.employee_id }} - {{ employee.user.email }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Month <span class="text-danger">*</span></label>
                        <input type="text" name="month" class="form-control" placeholder="June" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Year <span class="text-danger">*</span></label>
                        <input type="number" name="year" class="form-control" value="2026" required>
                    </div>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold text-primary mb-3">
                        <i class="bi bi-calendar-check me-1"></i> Attendance Details
                    </h5>
                    <div class="row p-3 bg-light rounded-3 g-3">
                        <div class="col-sm-4">
                            <label class="form-label small text-secondary">Days In Month <span class="text-danger">*</span></label>
                            <input type="number" name="days_in_month" class="form-control bg-white" value="30" required>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label small text-secondary">Effective Work Days <span class="text-danger">*</span></label>
                            <input type="number" name="effective_work_days" class="form-control bg-white" value="30" required>
                        </div>
                        <div class="col-sm-4">
                            <label class="form-label small text-secondary">LOP (Loss of Pay)</label>
                            <input type="number" name="lop" class="form-control bg-white" value="0">
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold text-success mb-3">
                        <i class="bi bi-plus-circle me-1"></i> Earnings Breakdown
                    </h5>
                    <div class="row p-3 bg-light rounded-3 g-3">
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">Basic Salary <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" name="basic_salary" class="form-control bg-white" required>
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">HRA</label>
                            <input type="number" step="0.01" name="hra" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">Conveyance</label>
                            <input type="number" step="0.01" name="conveyance" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-6 col-sm-6">
                            <label class="form-label small text-secondary">Special Allowance</label>
                            <input type="number" step="0.01" name="special_allowance" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-6 col-sm-12">
                            <label class="form-label small text-secondary">Bonus</label>
                            <input type="number" step="0.01" name="bonus" class="form-control bg-white" value="0.00">
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h5 class="fw-bold text-danger mb-3">
                        <i class="bi bi-dash-circle me-1"></i> Deductions Breakdown
                    </h5>
                    <div class="row p-3 bg-light rounded-3 g-3">
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">PF</label>
                            <input type="number" step="0.01" name="pf" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">ESI</label>
                            <input type="number" step="0.01" name="esi" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-4 col-sm-6">
                            <label class="form-label small text-secondary">Professional Tax</label>
                            <input type="number" step="0.01" name="professional_tax" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-6 col-sm-6">
                            <label class="form-label small text-secondary">Income Tax</label>
                            <input type="number" step="0.01" name="income_tax" class="form-control bg-white" value="0.00">
                        </div>
                        <div class="col-md-6 col-sm-12">
                            <label class="form-label small text-secondary">Other Deduction</label>
                            <input type="number" step="0.01" name="other_deduction" class="form-control bg-white" value="0.00">
                        </div>
                    </div>
                </div>

                <div class="text-end pt-3 border-top">
                    <button type="submit" class="btn btn-success px-4 shadow-sm">
                        <i class="bi bi-check-circle me-1"></i> Generate Payslip
                    </button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}
