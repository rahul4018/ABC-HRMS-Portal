{% extends 'layouts/base.html' %}{% block content %}<div class="container py-4"><div class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="fw-bold">Add Candidate</h2><p class="text-muted">Create the candidate record and place them in the Applied stage.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label>Job Requirement *</label><select required name="requirement" class="form-select">{% for r in requirements %}<option value="{{ r.pk }}" {% if request.GET.requirement == r.pk|stringformat:'s' %}selected{% endif %}>{{ r.title }} — {{ r.department }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Source</label><select name="source" class="form-select">{% for key,label in sources %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Full Name *</label><input required name="full_name" class="form-control"></div><div class="col-md-6"><label>Email *</label><input required name="email" type="email" class="form-control"></div><div class="col-md-6"><label>Phone *</label><input required name="phone" class="form-control"></div><div class="col-md-6"><label>Resume</label><input name="resume" type="file" class="form-control" accept=".pdf,.doc,.docx"></div><div class="col-md-4"><label>Current Company</label><input name="current_company" class="form-control"></div><div class="col-md-4"><label>Current Designation</label><input name="current_designation" class="form-control"></div><div class="col-md-4"><label>Total Experience (Years)</label><input name="total_experience_years" type="number" step="0.1" min="0" class="form-control"></div><div class="col-md-4"><label>Expected Salary (Annual)</label><input name="expected_salary" type="number" step="0.01" class="form-control"></div><div class="col-md-4"><label>Notice Period</label><input name="notice_period" class="form-control"></div><div class="col-md-4"><label>Location</label><input name="location" class="form-control"></div><div class="col-md-6"><label>Qualification</label><input name="qualification" class="form-control"></div><div class="col-md-6"><label>Skills</label><input name="skills" class="form-control" placeholder="Python, Django, SQL"></div></div><button class="btn btn-primary mt-4">Add to Pipeline</button><a href="{% url 'candidate_list' %}" class="btn btn-light mt-4 ms-2">Cancel</a></form></div></div></div>{% endblock %}
