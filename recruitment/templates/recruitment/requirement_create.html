{% extends 'layouts/base.html' %}{% block content %}<div class="container py-4"><div class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="fw-bold">Create Job Requirement</h2><p class="text-muted">Define the role, hiring configuration and publishing details.</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label>Position Title *</label><input required name="title" class="form-control"></div><div class="col-md-6"><label>Department *</label><select required name="department" class="form-select"><option value="">Select department</option>{% for d in departments %}<option>{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label>Openings</label><input name="openings" type="number" min="1" value="1" class="form-control"></div><div class="col-md-3"><label>Experience</label><input name="experience" class="form-control" placeholder="2-4 Years"></div><div class="col-md-3"><label>Employment Type</label><select name="employment_type" class="form-select"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></div><div class="col-md-3"><label>Work Mode</label><select name="work_mode" class="form-select"><option>On-site</option><option>Hybrid</option><option>Remote</option></select></div><div class="col-md-6"><label>Location</label><input name="location" class="form-control" value="Demo City"></div><div class="col-md-6"><label>Qualification</label><input name="qualification" class="form-control"></div><div class="col-md-6"><label>Salary Min (Annual)</label><input name="salary_min" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label>Salary Max (Annual)</label><input name="salary_max" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label>Notice Period</label><input name="notice_period" class="form-control" placeholder="30 Days"></div><div class="col-md-6"><label>Joining Timeline</label><input name="joining_timeline" class="form-control" placeholder="Immediate / 30 Days"></div><div class="col-md-6"><label>Recruiter</label><input name="recruiter_name" class="form-control"></div><div class="col-md-6"><label>Hiring Manager</label><input name="hiring_manager" class="form-control"></div><div class="col-md-6"><label>Target Hiring Date</label><input name="target_hiring_date" type="date" class="form-control"></div><div class="col-md-6"><label>Application Deadline</label><input name="application_deadline" type="date" class="form-control"></div><div class="col-12"><label>Job Description</label><textarea name="description" rows="4" class="form-control"></textarea></div><div class="col-md-6"><label>Responsibilities</label><textarea name="responsibilities" rows="4" class="form-control"></textarea></div><div class="col-md-6"><label>Required Skills</label><textarea name="required_skills" rows="4" class="form-control"></textarea></div><div class="col-md-6"><label>Preferred Skills</label><textarea name="preferred_skills" rows="4" class="form-control"></textarea></div><div class="col-md-6"><label>Education / Certifications</label><textarea name="education" rows="2" class="form-control"></textarea><input name="certifications" class="form-control mt-2" placeholder="Certifications"></div></div><div class="mt-4"><button class="btn btn-primary">Open Position</button><a href="{% url 'requirement_list' %}" class="btn btn-light ms-2">Cancel</a></div></form></div></div></div>{% endblock %}
