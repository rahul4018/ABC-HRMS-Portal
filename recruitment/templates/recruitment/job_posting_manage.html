{% extends 'layouts/base.html' %}{% block content %}<div class="container py-4"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="fw-bold">Job Posting</h2><p class="text-muted">Publish this approved requirement to the internal/public careers page.</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-8"><label>Headline</label><input name="headline" value="{{ posting.headline }}" class="form-control"></div><div class="col-md-4"><label>Status</label><select name="status" class="form-select">{% for k,l in statuses %}<option value="{{ k }}" {% if posting.status == k %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div><div class="col-12"><label>Slug</label><input name="slug" value="{{ posting.slug }}" class="form-control"></div><div class="col-12"><label>Public Description</label><textarea name="public_description" rows="6" class="form-control">{{ posting.public_description }}</textarea></div><div class="col-12"><label>Application Instructions</label><textarea name="application_instructions" rows="4" class="form-control">{{ posting.application_instructions }}</textarea></div></div><button class="btn btn-primary mt-4">Save Posting</button><a href="{% url 'requirement_detail' requirement.pk %}" class="btn btn-light mt-4 ms-2">Back</a><a href="{% url 'career_page' %}" class="btn btn-outline-primary mt-4 ms-2">View Career Page</a></form></div></div></div>{% endblock %}
