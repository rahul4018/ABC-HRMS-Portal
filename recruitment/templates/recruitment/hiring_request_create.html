{% extends 'layouts/base.html' %}{% block content %}<div class="container py-4"><div class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="fw-bold">Create Hiring Request</h2><p class="text-muted">Start the hiring process with a manpower request.</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-6"><label class="form-label">Position Title *</label><input name="position_title" required class="form-control"></div><div class="col-md-6"><label class="form-label">Department *</label><select name="department" required class="form-select"><option value="">Select department</option>{% for d in departments %}<option>{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Openings</label><input name="openings" type="number" min="1" value="1" class="form-control"></div><div class="col-md-4"><label class="form-label">Employment Type</label><select name="employment_type" class="form-select"><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Internship</option></select></div><div class="col-md-4"><label class="form-label">Priority</label><select name="priority" class="form-select"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option></select></div><div class="col-md-6"><label class="form-label">Required By</label><input name="required_by" type="date" class="form-control"></div><div class="col-12"><label class="form-label">Business Reason</label><textarea name="reason" rows="4" class="form-control" placeholder="New project, replacement, expansion, backfill..."></textarea></div></div><div class="mt-4"><button class="btn btn-primary">Submit for Approval</button><a href="{% url 'hiring_request_list' %}" class="btn btn-light ms-2">Cancel</a></div></form></div></div></div>{% endblock %}
