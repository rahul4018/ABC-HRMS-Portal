{% extends 'layouts/base.html' %}{% block content %}<div class="container py-4"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h2 class="fw-bold">Interview Feedback</h2><p class="text-muted">{{ interview.candidate.applicant.full_name }} · {{ interview.get_round_name_display }} · {{ interview.ABCeduled_at|date:'Y-m-d H:i' }}</p><form method="post">{% csrf_token %}<div class="row g-3"><div class="col-md-3"><label>Technical Skills</label><input name="technical_skills" type="number" min="0" max="5" value="{{ feedback.technical_skills|default:0 }}" class="form-control"></div><div class="col-md-3"><label>Communication</label><input name="communication" type="number" min="0" max="5" value="{{ feedback.communication|default:0 }}" class="form-control"></div><div class="col-md-3"><label>Problem Solving</label><input name="problem_solving" type="number" min="0" max="5" value="{{ feedback.problem_solving|default:0 }}" class="form-control"></div><div class="col-md-3"><label>Culture Fit</label><input name="culture_fit" type="number" min="0" max="5" value="{{ feedback.culture_fit|default:0 }}" class="form-control"></div><div class="col-md-3"><label>Overall Rating</label><input name="overall_rating" type="number" step="0.1" min="0" max="5" value="{{ feedback.overall_rating|default:0 }}" class="form-control"></div><div class="col-md-9"><label>Recommendation</label><select name="recommendation" class="form-select">{% for k,l in recommendations %}<option value="{{ k }}">{{ l }}</option>{% endfor %}</select></div><div class="col-12"><label>Comments</label><textarea name="comments" rows="5" class="form-control">{{ feedback.comments }}</textarea></div></div><button class="btn btn-primary mt-4">Save Feedback</button><a href="{% url 'candidate_detail' interview.candidate.applicant_id %}" class="btn btn-light mt-4 ms-2">Cancel</a></form></div></div></div>{% endblock %}
